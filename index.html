<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AB RFQ">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>American Block RFQ</title>
  <style>
    :root{
      --bg:#0b0f19; --panel:#171c27; --panel2:#202736; --text:#f7f8fa;
      --muted:#aeb7c7; --line:#394255; --accent:#3b82f6; --green:#16a34a;
      --red:#dc2626; --yellow:#d97706;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .wrap{max-width:760px;margin:auto;padding:18px 14px 110px}
    h1{font-size:22px;margin:4px 0 18px}
    h2{font-size:19px;margin:0 0 14px}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .metric,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px}
    .metric{padding:16px}
    .metric small{display:block;color:var(--muted);font-size:14px;margin-bottom:7px}
    .metric strong{font-size:24px}
    .card{padding:16px;margin-top:16px}
    label{display:block;font-size:14px;margin:12px 0 6px;color:var(--muted)}
    input,select,textarea,button{
      width:100%;font:inherit;border-radius:14px;border:1px solid var(--line);
      background:#111722;color:var(--text);padding:13px 14px
    }
    textarea{min-height:92px;resize:vertical}
    button{background:var(--accent);border:none;font-weight:700}
    button.secondary{background:transparent;border:1px solid var(--line);width:auto}
    button.danger{background:var(--red);width:auto}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .item{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}
    .item-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
    .total{display:flex;justify-content:space-between;align-items:center;background:#101827;border-radius:14px;padding:14px;margin-top:12px}
    .quote-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:14px}
    .quote-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .badge{font-size:12px;padding:6px 9px;border-radius:999px;background:#263248;color:#d7e5ff}
    .quote-total{font-size:22px;font-weight:800;margin:10px 0}
    .muted{color:var(--muted)}
    .products{margin:10px 0}
    .product-line{padding:9px 0;border-top:1px solid var(--line)}
    .actions{display:flex;gap:8px;margin-top:12px}
    .actions button{width:auto;flex:1}
    .toolbar{display:flex;gap:8px;margin-top:14px}
    .toolbar button{flex:1}
    .hidden{display:none}
    .notice{color:var(--muted);font-size:13px;margin-top:10px}
    @media(max-width:520px){.row{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>American Block RFQ</h1>

    <section class="grid">
      <div class="metric"><small>Open RFQs</small><strong id="openCount">0</strong></div>
      <div class="metric"><small>Open Value</small><strong id="openValue">$0.00</strong></div>
      <div class="metric"><small>Follow-ups Due</small><strong id="dueCount">0</strong></div>
      <div class="metric"><small>Verbal Yes</small><strong id="verbalValue">$0.00</strong></div>
    </section>

    <section class="card">
      <h2>Add Pending RFQ</h2>
      <div class="row">
        <div>
          <label for="company">Company Name</label>
          <input id="company" placeholder="Customer company">
        </div>
        <div>
          <label for="quoteNo">RFQ / Quote Number</label>
          <input id="quoteNo" placeholder="Optional">
        </div>
      </div>
      <div class="row">
        <div>
          <label for="status">Status</label>
          <select id="status">
            <option>Waiting on Customer</option>
            <option>Pricing Review</option>
            <option>Verbal Yes</option>
            <option>Hold</option>
            <option>Closed Won</option>
            <option>Lost</option>
          </select>
        </div>
        <div>
          <label for="followup">Next Follow-up</label>
          <input id="followup" type="date">
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">
        <h2 style="margin:0">Products</h2>
        <button class="secondary" id="addItem">+ Add Item</button>
      </div>
      <div id="items"></div>
      <div class="total"><span>Quote Total</span><strong id="draftTotal">$0.00</strong></div>

      <label for="feedback">Customer Feedback</label>
      <textarea id="feedback" placeholder="What did the customer say?"></textarea>
      <label for="nextAction">Next Action</label>
      <input id="nextAction" placeholder="Call, visit, revise quote, check inventory...">

      <div class="toolbar">
        <button id="save">Save RFQ</button>
        <button id="export" class="secondary">Export Backup</button>
      </div>
      <input id="importFile" class="hidden" type="file" accept=".json,application/json">
      <button id="import" class="secondary" style="margin-top:8px;width:100%">Import Backup</button>
      <div id="message" class="notice"></div>
    </section>

    <section style="margin-top:22px">
      <div class="row">
        <div>
          <label for="search">Search</label>
          <input id="search" placeholder="Company, part number, product...">
        </div>
        <div>
          <label for="filter">Filter Status</label>
          <select id="filter">
            <option>All</option>
            <option>Waiting on Customer</option>
            <option>Pricing Review</option>
            <option>Verbal Yes</option>
            <option>Hold</option>
            <option>Closed Won</option>
            <option>Lost</option>
          </select>
        </div>
      </div>
      <div id="quotes"></div>
    </section>
  </main>

  <template id="itemTemplate">
    <div class="item">
      <div class="row">
        <div><label>Part Number</label><input data-k="part" placeholder="Part #"></div>
        <div><label>Product</label><input data-k="product" placeholder="Description"></div>
      </div>
      <div class="row">
        <div><label>Quantity</label><input data-k="qty" type="number" min="0" step="1" value="1"></div>
        <div><label>Unit Price</label><input data-k="price" type="number" min="0" step="0.01" value="0"></div>
      </div>
      <div class="item-actions">
        <span>Line Total: <strong data-k="line">$0.00</strong></span>
        <button class="danger" data-action="remove">Remove</button>
      </div>
    </div>
  </template>

  <script>
    const key = "americanBlockRFQs_v1";
    const money = new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"});
    let rfqs = JSON.parse(localStorage.getItem(key) || "[]");
    let editingId = null;

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const saveLocal = () => localStorage.setItem(key, JSON.stringify(rfqs));
    const totalOf = r => r.items.reduce((a,i)=>a+(Number(i.qty)||0)*(Number(i.price)||0),0);
    const isOpen = r => !["Closed Won","Lost"].includes(r.status);

    function addItem(data={part:"",product:"",qty:1,price:0}){
      const node = $("itemTemplate").content.firstElementChild.cloneNode(true);
      node.querySelector('[data-k="part"]').value=data.part;
      node.querySelector('[data-k="product"]').value=data.product;
      node.querySelector('[data-k="qty"]').value=data.qty;
      node.querySelector('[data-k="price"]').value=data.price;
      node.querySelectorAll("input").forEach(i=>i.addEventListener("input",updateDraft));
      node.querySelector('[data-action="remove"]').addEventListener("click",()=>{node.remove();if(!$("items").children.length)addItem();updateDraft()});
      $("items").appendChild(node); updateDraft();
    }
    function draftItems(){
      return [...document.querySelectorAll("#items .item")].map(n=>({
        part:n.querySelector('[data-k="part"]').value.trim(),
        product:n.querySelector('[data-k="product"]').value.trim(),
        qty:Number(n.querySelector('[data-k="qty"]').value)||0,
        price:Number(n.querySelector('[data-k="price"]').value)||0
      }));
    }
    function updateDraft(){
      let total=0;
      document.querySelectorAll("#items .item").forEach(n=>{
        const q=Number(n.querySelector('[data-k="qty"]').value)||0;
        const p=Number(n.querySelector('[data-k="price"]').value)||0;
        const line=q*p; total+=line;
        n.querySelector('[data-k="line"]').textContent=money.format(line);
      });
      $("draftTotal").textContent=money.format(total);
    }
    function resetForm(){
      editingId=null;
      ["company","quoteNo","followup","feedback","nextAction"].forEach(id=>$(id).value="");
      $("status").value="Waiting on Customer";
      $("items").innerHTML=""; addItem(); $("save").textContent="Save RFQ";
    }
    function fillForm(r){
      editingId=r.id;
      $("company").value=r.company; $("quoteNo").value=r.quoteNo||""; $("status").value=r.status;
      $("followup").value=r.followup||""; $("feedback").value=r.feedback||""; $("nextAction").value=r.nextAction||"";
      $("items").innerHTML=""; r.items.forEach(addItem); $("save").textContent="Update RFQ";
      window.scrollTo({top:0,behavior:"smooth"});
    }
    function render(){
      const open=rfqs.filter(isOpen);
      $("openCount").textContent=open.length;
      $("openValue").textContent=money.format(open.reduce((s,r)=>s+totalOf(r),0));
      const today=new Date(); today.setHours(0,0,0,0);
      $("dueCount").textContent=open.filter(r=>r.followup && new Date(r.followup+"T00:00:00")<=today).length;
      $("verbalValue").textContent=money.format(rfqs.filter(r=>r.status==="Verbal Yes").reduce((s,r)=>s+totalOf(r),0));

      const query=$("search").value.toLowerCase();
      const filter=$("filter").value;
      const shown=rfqs.filter(r=>{
        const hay=[r.company,r.quoteNo,r.status,r.feedback,r.nextAction,...r.items.flatMap(i=>[i.part,i.product])].join(" ").toLowerCase();
        return (filter==="All"||r.status===filter) && hay.includes(query);
      });
      $("quotes").innerHTML=shown.length?"":"<p class='muted'>No RFQs found.</p>";
      shown.forEach(r=>{
        const div=document.createElement("article");
        div.className="quote-card";
        div.innerHTML=`
          <div class="quote-head">
            <div><strong>${esc(r.company)}</strong><div class="muted">${esc(r.quoteNo||"No quote number")}</div></div>
            <span class="badge">${esc(r.status)}</span>
          </div>
          <div class="quote-total">${money.format(totalOf(r))}</div>
          <div class="products">${r.items.map(i=>`
            <div class="product-line">
              <strong>${esc(i.product||"Product")}</strong>
              <div class="muted">${esc(i.part||"No part number")} · Qty ${i.qty} · ${money.format(i.price)} ea</div>
              <div>${money.format(i.qty*i.price)}</div>
            </div>`).join("")}
          </div>
          <div><span class="muted">Customer feedback:</span> ${esc(r.feedback||"None")}</div>
          <div style="margin-top:8px"><span class="muted">Next action:</span> ${esc(r.nextAction||"None")}</div>
          <div style="margin-top:8px"><span class="muted">Follow-up:</span> ${esc(r.followup||"Not scheduled")}</div>
          <div class="actions">
            <button data-edit="${r.id}" class="secondary">Edit</button>
            <button data-delete="${r.id}" class="danger">Delete</button>
          </div>`;
        $("quotes").appendChild(div);
      });
      document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>fillForm(rfqs.find(r=>r.id===b.dataset.edit)));
      document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{
        if(confirm("Delete this RFQ?")){rfqs=rfqs.filter(r=>r.id!==b.dataset.delete);saveLocal();render()}
      });
    }

    $("addItem").onclick=()=>addItem();
    $("save").onclick=()=>{
      const company=$("company").value.trim();
      if(!company){$("message").textContent="Enter a company name.";return}
      const record={
        id:editingId||crypto.randomUUID(),
        company, quoteNo:$("quoteNo").value.trim(), status:$("status").value,
        followup:$("followup").value, feedback:$("feedback").value.trim(),
        nextAction:$("nextAction").value.trim(), items:draftItems()
      };
      if(editingId) rfqs=rfqs.map(r=>r.id===editingId?record:r); else rfqs.unshift(record);
      saveLocal(); resetForm(); render(); $("message").textContent="Saved on this device.";
    };
    $("search").oninput=render; $("filter").onchange=render;
    $("export").onclick=()=>{
      const blob=new Blob([JSON.stringify(rfqs,null,2)],{type:"application/json"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
      a.download=`american-block-rfq-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
      URL.revokeObjectURL(a.href);
    };
    $("import").onclick=()=>$("importFile").click();
    $("importFile").onchange=async e=>{
      try{const text=await e.target.files[0].text(); const data=JSON.parse(text); if(!Array.isArray(data))throw new Error();
        rfqs=data; saveLocal(); render(); $("message").textContent="Backup imported.";
      }catch{$("message").textContent="That backup file could not be imported."}
    };

    if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js"));
    addItem(); render();
  </script>
</body>
</html>
